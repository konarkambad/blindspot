<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Eye outline -->
  <ellipse cx="50" cy="50" rx="45" ry="28" fill="none" stroke="#333" stroke-width="4"/>
  <!-- Iris -->
  <circle cx="50" cy="50" r="14" fill="none" stroke="#333" stroke-width="4"/>
  <!-- Pupil -->
  <circle cx="50" cy="50" r="6" fill="#333"/>
  <!-- Blind spot slash -->
  <line x1="15" y1="15" x2="85" y2="85" stroke="#e74c3c" stroke-width="5" stroke-linecap="round"/>
</svg>
